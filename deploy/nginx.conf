# Host Nginx site for the portfolio backend (same setup as TaskFlow).
# One free DuckDNS domain serves both the API and the media files:
#   https://<domain>/api/...    → API   (127.0.0.1:3100)
#   https://<domain>/media/...  → MinIO (127.0.0.1:9100, bucket "media")
#
# Install (replace the domain first):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo sed -i 's/PORTFOLIO_DOMAIN/sheila-portfolio.duckdns.org/g' /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sheila-portfolio.duckdns.org    # adds HTTPS + http→https redirect

server {
    listen 80;
    listen [::]:80;
    server_name PORTFOLIO_DOMAIN;

    # Admin uploads: up to 10 files per request, 60 MB each at most
    client_max_body_size 200m;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Public bucket. File names are unique (uuid), so they can be cached forever.
    location /media/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Only reads from the outside; uploads go through the API.
        limit_except GET HEAD { deny all; }
    }

    location / {
        return 404;
    }
}
