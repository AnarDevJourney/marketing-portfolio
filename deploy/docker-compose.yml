# Production stack on the VPS: API + MongoDB + MinIO.
# HTTPS is terminated by the host's Nginx + Let's Encrypt (deploy/nginx.conf) — the same
# setup as the TaskFlow backend on this VPS. The public site itself is on Netlify.
#
#   cd deploy && cp .env.example .env   # fill in the values
#   docker compose up -d --build
#
# Ports are bound to 127.0.0.1 only and chosen not to clash with TaskFlow
# (3000, 27017, 6379, 9000, 9001):
#   3100 → API          (Nginx: /api/)
#   9100 → MinIO S3     (Nginx: /media/)
#   9101 → MinIO console (SSH tunnel: ssh -L 9101:localhost:9101 user@vps)
# MongoDB has no host port at all.

name: portfolio

services:
  api:
    build: ../server
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/portfolio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    ports: ['127.0.0.1:3100:3000']
    depends_on: [mongo, minio]
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    restart: unless-stopped

  minio:
    # The official minio/minio image is no longer published; Chainguard's build is used.
    image: chainguard/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in deploy/.env}
    ports:
      - '127.0.0.1:9100:9000'
      - '127.0.0.1:9101:9001'
    volumes: [minio_data:/data]
    restart: unless-stopped

volumes:
  mongo_data: {}
  minio_data: {}
